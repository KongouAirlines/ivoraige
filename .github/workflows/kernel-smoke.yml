name: Kernel distribution smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-smoke:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['26.13.0']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: PDF distribution inventory fixtures
        run: python -m unittest discover -s test -p audit_pdf_closure_test.py
      - run: python -m unittest discover -s sidecars/babeldoc -p test_server.py
      - name: Release archive audit fixtures
        run: python -m unittest discover -s test -p audit_release_archives_test.py
      - run: npm ci
      - run: npm run setup:dsh
      - run: npm test
        timeout-minutes: 15
      - run: npm run smoke:package
