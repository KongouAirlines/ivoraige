name: Kernel distribution smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-smoke:
    name: ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run setup:dsh
      - run: npm test
      - run: npm run smoke:package
