name: Kernel distribution smoke

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package-smoke:
    name: ${{ matrix.os }} / Node 24
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s sidecars/babeldoc -p test_server.py
      - name: Release archive audit fixtures
        run: python -m unittest discover -s test -p audit_release_archives_test.py
      - run: npm ci
      - run: npm run setup:dsh
      - run: npm test
      - run: npm run smoke:package
